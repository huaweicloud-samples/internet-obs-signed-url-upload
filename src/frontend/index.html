<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图片直传对象存储 · 演示页</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; margin: 40px auto; max-width: 720px; color: #1f2329; }
    h1 { font-size: 22px; }
    p.desc { color: #5f6b7a; line-height: 1.7; }
    label { display: block; margin: 18px 0 6px; font-weight: 600; }
    input[type=text], input[type=file] { width: 100%; padding: 9px; box-sizing: border-box; border: 1px solid #9aa3ad; border-radius: 4px; }
    button { margin-top: 18px; padding: 9px 22px; background: #d81e06; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
    button:disabled { background: #9aa3ad; cursor: not-allowed; }
    pre { background: #f5f6f8; padding: 14px; border-radius: 4px; white-space: pre-wrap; word-break: break-all; font-size: 13px; }
    .ok { color: #137333; }
    .err { color: #d81e06; }
  </style>
</head>
<body>
  <h1>图片直传对象存储</h1>
  <p class="desc">
    选择一张 JPEG 图片后点击上传：页面先向接口请求一个有时效的 PUT 授权 URL，
    随后把图片字节直接写入 OBS。文件不经过任何应用服务器。
  </p>

  <label for="api">授权接口地址（GET）</label>
  <input id="api" type="text" placeholder="https://<gateway-address>/release/upload-url">

  <label for="file">JPEG 图片</label>
  <input id="file" type="file" accept="image/jpeg">

  <button id="go">请求授权并直传</button>

  <h2>执行结果</h2>
  <pre id="log">等待操作…</pre>

  <script src="upload.js"></script>
  <script>
    const log = document.getElementById('log');
    const button = document.getElementById('go');

    function write(line) {
      log.textContent = line;
      log.className = '';
    }

    button.addEventListener('click', async () => {
      const api = document.getElementById('api').value.trim();
      const file = document.getElementById('file').files[0];
      if (!api) { write('请先填写授权接口地址'); return; }
      if (!file) { write('请先选择一张 JPEG 图片'); return; }

      button.disabled = true;
      try {
        write('① 请求授权 URL …');
        const response = await fetch(api, { method: 'GET' });
        if (!response.ok) throw new Error('授权接口返回 ' + response.status);
        const data = await response.json();
        if (!data.uploadURL) throw new Error('响应中缺少 uploadURL');

        write('② 浏览器直传 OBS：' + data.photoFilename + ' (' + file.size + ' bytes) …');
        const bytes = new Uint8Array(await file.arrayBuffer());
        await uploadClient.putToSignedUrl(data.uploadURL, bytes, 'image/jpeg');

        log.textContent = '✓ 上传完成\n对象名：' + data.photoFilename
          + '\n字节数：' + file.size
          + '\n授权 URL 已包含有效期与临时凭据标识，浏览器无需附加凭据。';
        log.className = 'ok';
      } catch (err) {
        log.textContent = '✗ ' + err.message;
        log.className = 'err';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
